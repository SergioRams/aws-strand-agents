[project]
name = "aws-strand-agents"
version = "0.1.0"
description = "AWS Strand Agents"
authors = [
    {name = "Sergio Rayon Mora",email = "sergio.rayon.mora@bath.edu"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "strands-agents (>=1.18.0,<2.0.0)",
    "strands-agents-tools (>=0.2.16,<0.3.0)",
    "strands-agents-builder (>=0.1.10,<0.2.0)",
    "uv (>=0.9.11,<0.10.0)",
    "graphviz (>=0.21,<0.22)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "networkx (>=3.5,<4.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "boto3 (>=1.41.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "pre-commit (>=4.4.0,<5.0.0)"
]
