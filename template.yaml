AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Fully serverless agentic workflow leveraging Strands Agents SDK"

Parameters:
  Environment:
    Type: String
    Default: "dev"
    AllowedValues: [dev, staging, prod]

  BucketName:
    Type: String
    Default: "strands-agentic-data-store"
    Description: "Base name for the S3 bucket"

  TavilyApiKey:
    Type: String
    NoEcho: true
    Description: "Tavily API Key for search functionality"

Globals:
  Function:
    Tracing: Active

Resources:
  # S3 Data Bucket
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Environment}-${BucketName}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: "Serverless-Agentic-Workflow"

  # Create placeholder objects for bucket prefixes
  CreatePrefixesFunction:
    Type: AWS::Serverless::Function
    Properties:
      InlineCode: |
        import boto3
        import cfnresponse
        def handler(event, context):
            s3 = boto3.client('s3')
            bucket = event['ResourceProperties']['BucketName']
            try:
                if event['RequestType'] in ['Create', 'Update']:
                    s3.put_object(Bucket=bucket, Key='output/.keep', Body=b'')
                    s3.put_object(Bucket=bucket, Key='audio/.keep', Body=b'')
                    s3.put_object(Bucket=bucket, Key='video/.keep', Body=b'')
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
            except Exception as e:
                cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
      Handler: index.handler
      Runtime: python3.13
      Timeout: 60
      Policies:
        - S3WritePolicy:
            BucketName: !Sub "${Environment}-${BucketName}"

  CreatePrefixes:
    Type: Custom::CreatePrefixes
    Properties:
      ServiceToken: !GetAtt CreatePrefixesFunction.Arn
      BucketName: !Ref DataBucket

  # API Gateway
  StrandAgentsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment

  # The API Handler
  StrandApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-strand-api-handler"
      CodeUri: src/
      Handler: api_handler.lambda_handler
      Runtime: python3.12
      Description: "API entry point that triggers the background worker."
      MemorySize: 128
      Timeout: 10
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref StrandWorkerFunction
      Environment:
        Variables:
          WORKER_FUNCTION_NAME: !Sub "${Environment}-strand-worker"
      Events:
        ApiGateway:
          Type: Api
          Properties:
            Path: /workflow
            Method: post
            RestApiId: !Ref StrandAgentsApi

  # The Lambda Worker (Docker image with ffmpeg)
  StrandWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./src
      DockerTag: !Sub "${Environment}-latest"
    Properties:
      FunctionName: !Sub "${Environment}-strand-worker"
      PackageType: Image
      ImageConfig:
        Command: ["worker.lambda_handler"]
      Description: "Orchestrates Strand Agents workflow in background."
      Timeout: 900
      MemorySize: 4096
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "${Environment}-${BucketName}"
        - S3WritePolicy:
            BucketName: !Sub "${Environment}-${BucketName}"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
                - polly:DescribeVoices
              Resource: "*"
            - Effect: Allow
              Action:
                - translate:TranslateText
                - translate:DescribeTextTranslationJob
              Resource: "*"
      Environment:
        Variables:
          S3_BUCKET: !Sub "${Environment}-${BucketName}"
          TAVILY_API_KEY: !Ref TavilyApiKey
          BYPASS_TOOL_CONSENT: "True"


Outputs:

  # Storage
  DataBucket:
    Description: "S3 Bucket Name"
    Value: !Ref DataBucket

  # Lambda
  StrandWorkerFunctionName:
    Description: "Worker Lambda Function Name"
    Value: !Ref StrandWorkerFunction

  StrandWorkerFunctionArn:
    Description: "Worker Lambda ARN"
    Value: !GetAtt StrandWorkerFunction.Arn

  # API Gateway
  StrandAgentsApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${StrandAgentsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/workflow/"
